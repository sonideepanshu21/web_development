<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>FORM</title>

<fieldset>
<body>

    <table width="70%" border="0">

            <td>
                <fieldset>
                     <header><b>Doctor Appointment Form</b></header>
                <hr color="red">
                <table>
                    <tr>
                        <td>Appointment Date :
                            <input type="date" name="date" id="date">
                        </td>
                    </tr>
                    <tr>
                        <td>Appointment Time :
                            <input type="time" name="time" id="time">
                        </td>
                    </tr>
                    <tr>
                        <td>Name :
                            <input type="text" name="text" id="text" placeholder="First">
                            <input type="text" name="text" id="text" placeholder="Last">
                        </td>
                        <td>
                        </td>
                    </tr>
                    <tr>
                        <td>Gender :
                            <input type="radio" id="male"> <span>Male</span>
                            <input type="radio" id="male"> <span>Female</span>
                        </td>
                    </tr>
                    <tr>
                        <td>Phone No :
                            <input type="mobile" name="mobile" placeholder="+91.........">
                        </td>
                    </tr>
                    <tr>
                        <td>Adress :
                            <input type="text" placeholder="city">
                            <input type="text" placeholder="state"> <span></span>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Your Query :
                            <textarea name="text" id="text">
                            </textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Appointment Type : select which Appointmenttype(s) you require
                            <table align="center">
                                <tr>
                                    <td>
                                        <input type="checkbox" name=""> <span>Cervix checkup</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="checkbox" name=""> <span>Heart checkup</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="checkbox" name=""> <span>Eye checkup</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="checkbox" name=""> <span>Hearing Text</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                </fieldset>
               
            </td>

            </tr>
    </table>

    <br><br><br><br>
</body>
