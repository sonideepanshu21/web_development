<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>Hello world</div>
    <div>Hello world2</div>

    <hr>

    <span>hello new duniya </span>

    <hr>
    <fieldset>
        <div>
        <label for="name">NAME : </label>
        <input type="name" name="name" id="name" placeholder="Enter your name">
    </div>
    <br>
    <div>
        <label for="FATHER">FATHER'S NAME : </label>
        <input type="text" name="FATHER" id="FATHER" placeholder="Enter your father's name">
    </div>
    <br>
    <div>
        <label for="MOTHER">MOTHER'S NAME : </label>
        <input type="text" name="MOTHER" id="MOTHER" placeholder="Enter your mother's name">
    </div>
    <br>
    <div>
        <label for="DOB">DATE OF BIRTH : </label>
        <input type="date" name="DOB" id="DOB">
    </div>
    <br> 
    <div>
        <label for="PHONE NO.">PHONE NO. : </label>
        <input type="text" name="PHONE NO." id="PHONE NO." placeholder="Enter your phone number">
    </div>
    <br>
    <div><label for="EMAIL">EMAIL : </label>
        <input type="email" name="EMAIL" id="EMAIL" placeholder="Enter your email">
    </div>
    <br>
    <div>
        <label for="PASSWORD">PASSWORD : </label>
        <input type="password" name="PASSWORD" id="PASSWORD" placeholder="Enter your password">
    </div>
    <br>
    <div>
        <label for="CONFORM PASSWORD "> CONFIRM PASSWORD : </label>
        <input type="password" name="CONFORM PASSWORD " id="CONFORM PASSWORD " placeholder="Confirm your password">
    </div>
    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <br>
    <br>
</fieldset>
    
</body>
</html>
